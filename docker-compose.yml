# Development:   docker compose up -d db            (only PostgreSQL, as before)
# Full stack:    docker compose --profile full up -d --build
#                (set DISCORD_WEBHOOK_URL in .env to receive alerts on Discord)
# See ADR 0013 and the "Wdrożenie" section of README.md.
#
# Passwords come from .env (see .env.example). The defaults are for a local machine only.
#
# Network (ADR 0016): only Caddy (ports 80/443) is reachable from outside. Every other port
# is bound to 127.0.0.1, i.e. reachable only from the server itself (use an SSH tunnel:
# ssh -L 9090:localhost:9090 server). This matters because Docker's published ports
# bypass host firewalls like ufw.

x-app: &app
  image: ${SONGLY_IMAGE:-songly-insights:local}
  build: .
  profiles: [full]
  environment:
    DATABASE_URL: postgresql+psycopg://songly:${POSTGRES_PASSWORD:-songly}@db:5432/insights
    MUSICBRAINZ_CONTACT: ${MUSICBRAINZ_CONTACT:-}
    PREFECT_API_URL: http://prefect:4200/api
    # One JSON object per log line (ADR 0018); `docker compose logs api | jq` can filter it.
    LOG_FORMAT: json
    # Prefect would otherwise send anonymous usage statistics.
    PREFECT_SERVER_ANALYTICS_ENABLED: "false"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: songly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-songly}
      POSTGRES_DB: insights
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts in this folder run once, when the data volume is created.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U songly -d insights"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Runs `alembic upgrade head` once and exits. The API starts only after it succeeded,
  # so the API never runs against an old schema.
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The slim image has no curl; Python can do the same request.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Prefect server: keeps the history of pipeline runs and serves the UI on :4200.
  prefect:
    <<: *app
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    environment:
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      # The UI files are prepared at start; the default folder (inside the installed
      # package) is not writable for the non-root user.
      PREFECT_UI_STATIC_DIRECTORY: /home/songly/.prefect/ui
    ports:
      - "127.0.0.1:4200:4200"
    volumes:
      - prefect:/home/songly/.prefect
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Runs the pipeline on a schedule (default: every day at 03:15 UTC).
  pipeline:
    <<: *app
    command: ["python", "-m", "pipeline", "serve", "--cron", "${PIPELINE_CRON:-15 3 * * *}"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      prefect:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [full]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      # The address people use to open Prometheus; links in alert messages point here.
      - --web.external-url=${PROMETHEUS_EXTERNAL_URL:-http://localhost:9090}
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - prometheus:/prometheus
    depends_on:
      - alertmanager
    restart: unless-stopped

  # HTTPS reverse proxy for the API and Grafana (ADR 0016).
  caddy:
    image: caddy:2.10
    profiles: [full]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.localhost}
      GRAFANA_DOMAIN: ${GRAFANA_DOMAIN:-grafana.localhost}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here: keep the volume, or Let's Encrypt limits may be hit.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - grafana
    restart: unless-stopped

  # Daily pg_dump + test restore + rotation (ADR 0017). Dumps land in ./backups on the host.
  backup:
    image: postgres:16
    profiles: [full]
    entrypoint: ["bash", "/scripts/backup.sh"]
    # Default mode. Other modes: docker compose --profile full run --rm backup once
    #                            docker compose --profile full run --rm backup restore /backups/FILE
    command: ["loop"]
    environment:
      PGHOST: db
      PGUSER: songly
      PGPASSWORD: ${POSTGRES_PASSWORD:-songly}
      PGDATABASE: insights
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - ./deploy/backup:/scripts:ro
      - ./backups:/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Sends notifications for alerts fired by Prometheus (ADR 0015). UI on :9093.
  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: [full]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      # The address people use to open Alertmanager; used in the "Alerts:" link of messages.
      - --web.external-url=${ALERTMANAGER_EXTERNAL_URL:-http://localhost:9093}
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./deploy/alertmanager:/etc/alertmanager:ro
      # Remembers silences and which notifications were already sent across restarts.
      - alertmanager:/alertmanager
    secrets:
      - discord_webhook_url
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [full]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # The public HTTPS address (behind Caddy); Grafana builds its links from it.
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN:-grafana.localhost}
      # Read by the data source file (deploy/grafana/provisioning/datasources).
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
  prefect:
  prometheus:
  alertmanager:
  grafana:
  caddy_data:
  caddy_config:

# Secrets are mounted as files in /run/secrets/ of the services that ask for them, instead
# of environment variables (which are visible e.g. in `docker inspect`).
secrets:
  discord_webhook_url:
    # Read from DISCORD_WEBHOOK_URL in .env. The variable must exist (compose refuses to
    # start otherwise), but it may be empty: then notifications are not sent.
    environment: DISCORD_WEBHOOK_URL
