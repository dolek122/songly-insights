name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: songly
          POSTGRES_PASSWORD: songly
          POSTGRES_DB: insights_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U songly"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://songly:songly@localhost:5432/insights_test
      TEST_DATABASE_URL: postgresql+psycopg://songly:songly@localhost:5432/insights_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
