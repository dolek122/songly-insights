name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: songly
          POSTGRES_PASSWORD: songly
          POSTGRES_DB: insights_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U songly"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://songly:songly@localhost:5432/insights_test
      TEST_DATABASE_URL: postgresql+psycopg://songly:songly@localhost:5432/insights_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  # Prometheus configuration and unit tests of the alert rules (ADR 0014).
  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Prometheus config and test alert rules
        run: |
          promtool() {
            docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/p" -w /p \
              prom/prometheus:v3.5.0 "$@"
          }
          promtool check config prometheus.yml
          promtool test rules alerts_test.yml

  # Builds the Docker image on every push; publishes it to GitHub Container Registry
  # (ghcr.io/<owner>/<repo>) only from the default branch (ADR 0013).
  image:
    needs: [quality, alerts]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # "sha-1a2b3c4" for every build, "latest" for the default branch.
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse layers between builds (the dependency layer rarely changes).
          cache-from: type=gha
          cache-to: type=gha,mode=max
