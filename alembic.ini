[alembic]
script_location = %(here)s/migrations
# Readable file names: 2026_11_09_0001-initial_schema.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s-%%(slug)s
prepend_sys_path = .
path_separator = os
# sqlalchemy.url is not set here on purpose: migrations/env.py reads DATABASE_URL,
# so the password lives only in .env. Tests override it with set_main_option().

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
