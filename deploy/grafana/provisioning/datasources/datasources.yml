apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Songly PostgreSQL
    uid: songly-postgres
    type: grafana-postgresql-datasource
    url: db:5432
    user: grafana_reader
    jsonData:
      database: insights
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
